<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:'NotoDev'; src:url('file://{{ fonts_dir }}/NotoSansDevanagari.ttf'); font-weight:400 800; }
@font-face { font-family:'Manrope'; src:url('file://{{ fonts_dir }}/Manrope.ttf'); font-weight:400 800; }
@font-face { font-family:'Marker'; src:url('file://{{ fonts_dir }}/PermanentMarker-Regular.ttf'); }

:root{
  --blue:#1818F0; --red:#F01800; --yellow:#FFE600; --ink:#111111; --paper:#F8F6F1;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  width:{{ canvas_w }}px; height:{{ canvas_h }}px; overflow:hidden;
  display:flex; flex-direction:column;
  background-color:var(--paper);
  background-image:url('file://{{ decor_dir }}/paper_texture.png');
  background-size: 512px 512px; background-repeat:repeat;
  font-family:'NotoDev','Manrope',sans-serif; color:var(--ink);
}
/* Normal document flow (not fixed top:% absolute positions) so spacing
   adapts to actual content length instead of leaving a gap when a block
   (e.g. the category pill, or a short fact line) is shorter than the
   original reference posters' text. */
.block{ width:100%; text-align:center; flex:0 0 auto; }

.logo{ margin-top:3vh; height:9%; display:flex; justify-content:center; flex:0 0 auto; }
.logo img{ height:100%; }
.logo.corner{ justify-content:flex-start; height:7%; }

.congrats{ position:relative; font-family:'Marker'; font-size:84px; color:var(--blue);
  display:inline-flex; align-items:center; justify-content:center; gap:18px;
  width:fit-content; margin:0 auto; }
.congrats img{ height:38px; opacity:.85; }
.congrats img.right{ transform:scaleX(-1); }
.congrats .underline{ position:absolute; bottom:-16px; left:8%; width:84%;
  height:4px; background:var(--blue); border-radius:2px; }
.congrats-wrap{ margin-top:2vh; width:100%; height:11%; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; }

.pill{ margin-top:1.5vh; display:flex; justify-content:center; }
.pill span{ background:var(--red); color:#fff; font-family:'Manrope'; font-weight:800;
  font-size:40px; padding:10px 36px; border-radius:6px; }

.fact{ margin-top:2vh; padding:0 9%; font-family:'NotoDev'; font-size:calc(38px * {{ fact_scale | default(100) }} / 100); line-height:1.4; }
.fact .name{ color:var(--blue); font-weight:800; }
.fact .achieve{ color:var(--red); font-weight:700; }

.photo-wrap{ margin:2.5vh auto 0 auto; height:36%; width:80%; position:relative; flex:0 0 auto; }
.photo-wrap img.photo{ width:100%; height:100%; object-fit:cover; border-radius:18px;
  border:6px solid var(--ink); display:block; }
.photo-wrap.frame-yellow img.photo{ border:none; }
.photo-wrap .frame-overlay{ position:absolute; inset:-10px; width:calc(100% + 20px); height:calc(100% + 20px); }

.medallion{ position:absolute; right:3%; bottom:2%; width:16%; aspect-ratio:1/1;
  border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFF6C9, #FFD700 55%, #B8860B 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;
  font-family:'Manrope'; font-weight:800; color:var(--red); font-size:22px; line-height:1.1; text-align:center; z-index:5;}
.medallion .ribbon{ position:absolute; bottom:-10%; left:50%; transform:translateX(-50%); display:flex; gap:5px; z-index:4;}
.medallion .ribbon div{ width:13px; height:26px; background:var(--red); clip-path:polygon(0 0,100% 0,100% 75%,50% 100%,0 75%); }

.jnv{ margin-top:2vh; padding:0 9%; font-family:'NotoDev'; }
.jnv .line1{ color:var(--red); font-weight:800; font-size:calc(36px * {{ jnv_scale | default(100) }} / 100); }
.jnv .line2{ color:var(--ink); font-size:30px; margin-top:4px; }
.jnv .line2.note{ color:#6B7280; font-size:24px; font-style:italic; line-height:1.35; }

.footer{ margin-top:auto; height:8%; background:var(--yellow); display:flex; align-items:center; justify-content:center; gap:14px; flex:0 0 auto; }
.footer span{ font-family:'Manrope'; font-weight:800; font-size:26px; color:var(--ink); }
.footer .icons{ font-size:22px; letter-spacing:6px; }
</style>
</head>
<body>
  <div class="logo {{ 'corner' if logo_mode == 'corner' else '' }}">
    <img src="file://{{ logo_path }}">
  </div>

  <div class="congrats-wrap">
    <div class="congrats">
      <img src="file://{{ decor_dir }}/sparkle_blue.svg">
      <span>{{ congrats_word }}</span>
      <img class="right" src="file://{{ decor_dir }}/sparkle_blue.svg">
      <div class="underline"></div>
    </div>
  </div>

  {% if category_label %}
  <div class="block pill"><span>{{ category_label }}</span></div>
  {% endif %}

  <div class="block fact">{{ fact_html }}</div>

  <div class="photo-wrap {{ 'frame-yellow' if frame_style == 'yellow' else '' }}">
    <img class="photo" src="file://{{ photo_path }}">
    {% if frame_style == 'yellow' %}
    <img class="frame-overlay" src="file://{{ decor_dir }}/marker_frame_yellow.svg">
    {% endif %}
    {% if medallion_text %}
    <div class="medallion">{{ medallion_text }}<div class="ribbon"><div></div><div></div></div></div>
    {% endif %}
  </div>

  <div class="block jnv">
    <div class="line1">{{ jnv_name }}</div>
    <div class="line2 {{ 'note' if state_line_is_note else '' }}">{{ state_line }}</div>
  </div>

  <div class="block footer">
    <span class="icons">▶ 𝕏 ◎ f</span><span>Navodayans Talk</span>
  </div>
</body>
</html>
